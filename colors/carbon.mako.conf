##
## Carbon qt6ct color scheme.
## One entry per QPalette::ColorRole, in enum order.
##
<%
    # Bevel roles draw Fusion's outlines and separators, so they take
    # contrast-indexed steps that read as borders in either scheme.
    roles = [
        ('WindowText',      'gtk_window_fg'),
        ('Button',          'gtk_headerbar_bg'),
        ('Light',           'gtk_popover_bg'),
        ('Midlight',        'secondary_3'),
        ('Dark',            'secondary_7'),
        ('Mid',             'secondary_5'),
        ('Text',            'gtk_view_fg'),
        ('BrightText',      'text_15'),
        ('ButtonText',      'gtk_window_fg'),
        ('Base',            'gtk_view_bg'),
        ('Window',          'gtk_window_bg'),
        ('Shadow',          'shadow'),
        ('Highlight',       'gtk_accent_bg'),
        ('HighlightedText', 'gtk_accent_fg'),
        ('Link',            'web_link'),
        ('LinkVisited',     'web_link_visited'),
        ('AlternateBase',   'gtk_window_bg'),
        ('NoRole',          'canvas'),
        ('ToolTipBase',     'gtk_popover_bg'),
        ('ToolTipText',     'gtk_popover_fg'),
        ('PlaceholderText', 'text_7'),
        ('Accent',          'gtk_accent_bg'),
    ]
    dimmed = {'WindowText': 'text_6', 'Text': 'text_6', 'ButtonText': 'text_6', 'BrightText': 'text_8'}

    active = ['#ff' + color_named(key) for _, key in roles]
    inactive = active
    disabled = ['#ff' + color_named(dimmed.get(role, key)) for role, key in roles]
%>
[ColorScheme]
active_colors=${', '.join(active)}
inactive_colors=${', '.join(inactive)}
disabled_colors=${', '.join(disabled)}
